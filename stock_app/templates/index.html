<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Big Movers - 21 EMA Entry Finder</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .scan-button {
            background: #26a69a;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .scan-button:hover {
            background: #2bbbad;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .scan-button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results-header {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .stock-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .stock-card:hover {
            transform: translateY(-5px);
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .ticker {
            font-size: 2em;
            font-weight: bold;
            color: #26a69a;
        }
        
        .move-badge {
            background: #ff5252;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .stock-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 8px;
        }
        
        .info-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .ema-entry {
            color: #2196F3;
        }
        
        .chart-container {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
        }
        
        .error {
            background: #ff5252;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .subtitle {
                font-size: 1em;
            }
            
            .stock-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Stock Big Movers</h1>
            <p class="subtitle">Find stocks that moved 15%+ in the last week with 21 EMA entry points</p>
            <button class="scan-button" onclick="scanStocks()">Scan Stocks Now</button>
        </header>
        
        <div id="loading" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Scanning markets for big movers...</p>
                <p style="font-size: 0.9em; opacity: 0.8; margin-top: 10px;">This may take 30-60 seconds</p>
            </div>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        async function scanStocks() {
            const button = document.querySelector('.scan-button');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            button.disabled = true;
            button.textContent = 'Scanning...';
            loading.style.display = 'block';
            results.innerHTML = '';
            
            try {
                const response = await fetch('/api/scan');
                const data = await response.json();
                
                loading.style.display = 'none';
                button.disabled = false;
                button.textContent = 'Scan Again';
                
                if (!data.success) {
                    results.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                    return;
                }
                
                if (data.count === 0) {
                    results.innerHTML = `
                        <div class="results-header">
                            <h2>No stocks found with 15%+ moves in the last week</h2>
                            <p>Try adjusting the time period or percentage threshold</p>
                        </div>
                    `;
                    return;
                }
                
                results.innerHTML = `
                    <div class="results-header">
                        <h2>🎯 Found ${data.count} Big Movers!</h2>
                        <p>Stocks that moved 15% or more in a single day over the last week</p>
                    </div>
                `;
                
                data.stocks.forEach((stock, index) => {
                    const chartId = `chart-${index}`;
                    
                    results.innerHTML += `
                        <div class="stock-card">
                            <div class="stock-header">
                                <div class="ticker">${stock.ticker}</div>
                                <div class="move-badge">+${stock.move_percent}% Move</div>
                            </div>
                            
                            <div class="stock-info">
                                <div class="info-item">
                                    <div class="info-label">Move Date</div>
                                    <div class="info-value">${stock.date}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Current Price</div>
                                    <div class="info-value">$${stock.current_price}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">21 EMA Entry</div>
                                    <div class="info-value ema-entry">$${stock.ema_21}</div>
                                </div>
                            </div>
                            
                            <div class="chart-container">
                                <div id="${chartId}"></div>
                            </div>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        Plotly.newPlot(chartId, JSON.parse(stock.chart).data, JSON.parse(stock.chart).layout, {responsive: true});
                    }, 100);
                });
                
            } catch (error) {
                loading.style.display = 'none';
                button.disabled = false;
                button.textContent = 'Scan Stocks Now';
                results.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
